name: Build OpenCut

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS
          - os: windows-latest
            name: Windows

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.name }})

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri app
        run: npm run build

      - name: Create DMG from .app bundle
        if: matrix.os == 'macos-latest'
        run: |
          mkdir -p src-tauri/target/release/bundle/dmg
          DMG_NAME="OpenCut_${GITHUB_REF_NAME#v}_aarch64.dmg"
          hdiutil create -volname "OpenCut" \
            -srcfolder src-tauri/target/release/bundle/macos/OpenCut.app \
            -ov -format UDZO \
            "src-tauri/target/release/bundle/dmg/$DMG_NAME"

      - name: Sign DMG (tagged releases only)
        if: startsWith(github.ref, 'refs/tags/v') && matrix.os == 'macos-latest'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          echo "$TAURI_SIGNING_PRIVATE_KEY" > /tmp/tauri-key.pem
          for f in src-tauri/target/release/bundle/dmg/*.dmg; do
            npx tauri signer sign -k /tmp/tauri-key.pem -p "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" "$f"
          done
          rm /tmp/tauri-key.pem

      - name: Upload macOS artifact
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: OpenCut-macOS
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/dmg/*.dmg.sig
          if-no-files-found: error

      - name: Upload Windows artifact
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: OpenCut-Windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
          if-no-files-found: error

  create-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/OpenCut-macOS/*
            artifacts/OpenCut-Windows/*
          generate_release_notes: true
          make_latest: true
