[package]
name = "opencut"
version = "2.0.1"
description = "OpenCut - lightweight local clipboard manager"
authors = ["OpenCut"]
edition = "2021"

[lib]
name = "opencut_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api", "protocol-asset"] }
tauri-plugin-global-shortcut = "2"
open = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
md5 = "0.7"
arboard = "3"
parking_lot = "0.12"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
tauri-plugin-updater = "2.10.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
strip = true
panic = "abort"

[profile.dev]
opt-level = 1
